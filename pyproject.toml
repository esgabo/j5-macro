[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "j5-macro"
version = "0.0.1"
description = "Scriptable, debuggable desktop automation with human-like mouse and keyboard input."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gabriel Espinel" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Desktop Environment",
]
dependencies = [
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
x11 = ["python-xlib>=0.33", "mss>=9.0"]
windows = ["mss>=9.0"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26", "mss>=9.0"]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.18", "types-python-xlib>=0.33"]
# The GUI tests: pytest-qt fails to start pytest without a Qt binding, so it comes with
# PySide6 here instead of in dev. Without it the tests under tests/gui are skipped.
gui-test = ["PySide6-Essentials>=6.6", "pytest-qt>=4.4"]

[project.scripts]
j5 = "j5_macro.cli.main:main"

[project.urls]
Repository = "https://github.com/esgabo/j5-macro"

[tool.hatch.build.targets.wheel]
packages = ["src/j5_macro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "x11: needs python-xlib and a reachable X server with XTEST (run under xvfb-run); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/j5_macro"]

# The vision and gui extras are optional: type-check without them too.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mss", "mss.*", "numpy", "numpy.*", "PySide6", "PySide6.*",
          "shiboken6", "shiboken6.*"]
ignore_missing_imports = true

# Without PySide6 every Qt class is Any: let the GUI's widgets and QObjects subclass them
# then. With the gui extra installed (as in CI), PySide6's stubs make them real types.
[[tool.mypy.overrides]]
module = ["j5_macro.gui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

# The GUI's view models and engine thread import no Qt: fully strict either way.
[[tool.mypy.overrides]]
module = ["j5_macro.gui.models.*", "j5_macro.gui.engine_thread"]
disallow_subclassing_any = true
disallow_untyped_decorators = true
