[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "j5-macro"
version = "0.0.1"
description = "Scriptable, debuggable desktop automation with human-like mouse and keyboard input."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Espinel" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Desktop Environment",
]
dependencies = [
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
x11 = ["python-xlib>=0.33", "mss>=9.0"]
windows = ["mss>=9.0"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.18"]

[project.scripts]
j5 = "j5_macro.cli.main:main"

[project.urls]
Repository = "https://github.com/esgabo/j5-macro"

[tool.hatch.build.targets.wheel]
packages = ["src/j5_macro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/j5_macro"]
