name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - if: runner.os == 'Linux'
        run: python -m pip install -e ".[dev,x11,vision]"
      - if: runner.os != 'Linux'
        run: python -m pip install -e ".[dev,vision]"
      - run: ruff check .
      - run: mypy
      # X11 backend tests (marked x11) run against Xvfb; elsewhere they are skipped.
      - if: runner.os == 'Linux'
        env:
          J5_REQUIRE_X11: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" pytest -rs
      - if: runner.os != 'Linux'
        run: pytest -rs
