name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # xvfb for the X11 tests; the libraries Qt loads even on its offscreen platform
      # (the GUI tests set QT_QPA_PLATFORM=offscreen themselves).
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - if: runner.os == 'Linux'
        run: python -m pip install -e ".[dev,gui-test,x11,vision]"
      - if: runner.os != 'Linux'
        run: python -m pip install -e ".[dev,gui-test,windows,vision]"
      # The same script developers run locally: ruff, mypy and pytest (under Xvfb with
      # the X11 tests required on Linux; X11 tests are skipped elsewhere). With the
      # gui-test extra, mypy checks the GUI against PySide6's stubs and its tests run.
      - run: scripts/check.sh
        shell: bash
