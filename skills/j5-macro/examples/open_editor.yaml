# Start a text editor, wait until its window is open and ready, and type a line that
# includes today's date read from a program.
#
# Starting programs needs the run's opt-in, which only the user can give:
#
#   j5 run --allow-exec open_editor.yaml
#
# Without --allow-exec the exec steps fail with capability_missing. The editor is
# Mousepad (Xfce's); for another one change the command of `open_editor` and recapture
# #menu_bar from its window.
# The #menu_bar template ("File  Edit" of Mousepad's menu bar) was captured under Xvfb
# at 100 %; on another desktop recapture it once the editor is open:
#
#   j5 capture --bbox 2,2,72,20 --window Mousepad --embed open_editor.yaml --name menu_bar -f
version: 1
name: Open an editor and write a dated line
params:
  note: {description: Text to write after the date, default: "Written by j5."}
steps:
  # Started detached: the step finishes at once and the editor outlives the run.
  - id: open_editor
    exec: {command: [mousepad]}

  # Better than a fixed sleep: wait for the editor's window, keeping its full title
  # (editor = {window, bbox}) so the next steps target exactly that window.
  - id: wait_window
    wait_window_in: {title: Mousepad, timeout: 20s}
    as: editor

  # Then for something only the ready window shows, searching inside it (faster and
  # without look-alikes elsewhere on the desktop).
  - id: wait_editor
    wait_image_in: {image: "#menu_bar", window: {title: "${editor.window}"}, timeout: 10s}
    as: menu

  # Waited for, its output kept: today = {exit_code, stdout, stderr}.
  - id: read_date
    exec: {command: [date, +%F], wait: true, timeout: 5s}
    as: today
  # A dry run starts nothing, so its kept result has no stdout: fall back to a placeholder
  # there, so the dry run checks the rest of the script too.
  - id: date_text
    set: {name: date, expr: "strip(today.stdout) if 'stdout' in today else 'YYYY-MM-DD'"}

  # Click in the text area, six menu-bar heights below the menu bar, to give it the focus.
  - id: focus_text
    click: {at: "${menu}", offset: [0, 6h]}

  - id: write
    type: "${date}: ${note}\n"
