# Data entry: fill and submit the same form once for each row of a list, checking the
# confirmation every time, and report how many rows were saved.
#
# Target: the practice form of this skill (python3 ../scripts/practice_form.py). The
# embedded templates were captured from it under Xvfb at 100 %; on another desktop
# recapture them (j5 capture --bbox ... --embed fill_rows.yaml --name ... -f) and check
# them with j5 find before running.
#
# With the form open, the strict dry run passes: both labels must be on screen before
# the first click; the confirmation (#saved) only appears after a submit, which a dry
# run never sends, so it is a warning there ("not a failure in a strict dry run ...").
#
#   j5 run --dry-run --strict fill_rows.yaml   # describes every click and key, sends nothing
#   j5 run fill_rows.yaml --json < /dev/null
version: 1
name: Fill the practice form once per row
input:
  mouse: {speed: 1.5}
  keyboard: {wpm: 90}
vars:
  form: j5 practice form
  # Any YAML value works as a var: here a list of mappings. Params are scalars only, so
  # data like this lives in vars (or comes from a program through exec and `as`).
  rows:
    - {name: Ana Pérez, email: ana@example.com}
    - {name: Bo Li, email: bo@example.com}
    - {name: Chloé Martin, email: chloe@example.com}
  saved: 0
steps:
  # Find both labels once; every iteration aims at the kept results.
  - id: wait_form
    wait_image_in: {image: "#name_label", window: {title: "${form}"}, timeout: 10s}
    as: name_label
  - id: find_email_label
    wait_image_in: {image: "#email_label", window: {title: "${form}"}, timeout: 2s}
    as: email_label

  - id: each_row
    loop:
      for_each: rows
      as: row
      do:
        - id: click_name
          click: {at: "${name_label}", offset: [3.5w, 0]}
        - id: type_name
          type: "${row.name}"
        - id: click_email
          click: {at: "${email_label}", offset: [3.5w, 0]}
        - id: type_email
          type: "${row.email}"
        - id: submit
          click: {image: "#submit", window: {title: "${form}"}}
        # Up to 3 attempts in all if the confirmation is slow, then the run stops.
        - id: confirm
          wait_image_in: {image: "#saved", window: {title: "${form}"}, timeout: 3s}
          on_error: retry
        - id: count
          set: {name: saved, expr: "saved + 1"}

  - id: report
    log: "saved ${saved} of ${len(rows)} rows"
