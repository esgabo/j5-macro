# Fill a login form: find each field by its label, type the e-mail and a secret
# password, submit, and check that the form confirms it.
#
# Target: the practice form of this skill (python3 ../scripts/practice_form.py). The
# embedded templates were captured from it under Xvfb at 100 %; on another desktop the
# fonts differ, so recapture them first (j5 capture --bbox ... --window "j5 practice
# form" --embed sign_in.yaml --name email_label -f, and so on) and check each one with
# j5 find '#email_label' --script sign_in.yaml --window "j5 practice form".
#
# Run it with the password from the environment, never on the command line:
#
#   FORM_PASSWORD=... j5 run sign_in.yaml --param email=ana@example.com \
#       --param-env password=FORM_PASSWORD --json < /dev/null
version: 1
name: Sign in to the practice form
params:
  email: {description: Account e-mail}
  password: {secret: true, description: Account password}
vars:
  form: j5 practice form
steps:
  # Waits for the form and keeps where the label is: email_label = {found, score, bbox,
  # center, window, window_bbox}. Later steps aim at it with `at` without searching again.
  - id: wait_form
    wait_image: {image: "#email_label", window: {title: "${form}"}, timeout: 10s}
    as: email_label

  # The field is to the right of its label: 3.5 label widths from the label's centre.
  - id: click_email
    click: {at: "${email_label}", offset: [3.5w, 0]}
  - id: type_email
    type: "${email}"

  - id: find_password_label
    wait_image: {image: "#password_label", window: {title: "${form}"}, timeout: 2s}
    as: password_label
  - id: click_password
    click: {at: "${password_label}", offset: [2w, 0]}
  # A secret param: shown as *** in events and history; `type` reports only its length.
  - id: type_password
    type: "${password}"

  - id: submit
    click: {image: "#submit", window: {title: "${form}"}}

  # Check the outcome instead of assuming it.
  - id: confirm
    wait_image: {image: "#saved", window: {title: "${form}"}, timeout: 5s}
  - id: done
    log: "signed in as ${email}"
